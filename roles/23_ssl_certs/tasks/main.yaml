- name: Include host-specific vars
  ansible.builtin.include_vars: "{{ hostvars[inventory_hostname].vars_file }}"

- name: Copy root certificate
  ansible.builtin.copy:
    src: "{{ ssl_source_path }}/{{ root_cert_path }}/{{ root_cert_filename }}"
    dest: "/usr/local/share/ca-certificates/{{ root_cert_filename }}"
    owner: root
    group: root
    mode: '0644'

- name: Run certificate update
  ansible.builtin.command: update-ca-certificates
  changed_when: false

- name: Copy SSL cert
  ansible.builtin.copy:
    src: "{{ ssl_source_path }}/{{ set_hostname }}/{{ ssl_source_cert_filename }}"
    dest: "{{ ssl_destination_path }}/{{ set_hostname }}/{{ ssl_destination_cert_filename }}"
    owner: root
    group: www-data
    mode: '0640'

- name: Copy SSL key
  ansible.builtin.copy:
    src: "{{ ssl_source_path }}/{{ set_hostname }}/{{ ssl_source_key_filename }}"
    dest: "{{ ssl_destination_path }}/{{ set_hostname }}/{{ ssl_destination_key_filename }}"
    owner: root
    group: www-data
    mode: '0640'
